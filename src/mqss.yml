name: mqss
description: "CUDA-Q target for MQSS."
config:
  platform-qpu: mqss
  gen-target-backend: true
  link-libs: ["-lmqss-adapter"]
  jit-mid-level-pipeline: "quake-to-cc-prep"
  codegen-emission: qasm2
  library-mode: false

target-arguments:
  - key: token
    required: false
    type: string
    platform-arg: token
    help-string: "Authentication Token for Munich Quantum Portal."
  - key: device
    required: false
    type: string
    platform-arg: device
    help-string: "Target Quantum Resource that is available to Munich Quantum Portal. E.g. EQE1, AQT20"
  - key: endpoint
    required: false
    type: string
    platform-arg: endpoint
    help-string: "In remote mode, the URL of the Munich Quantum Portal, default: https://portal.quantum.lrz.de:4000/v1/. In HPC mode, the name of the target queue, default: qoffload_api_request_reception_queue_$(HOSTMANE)"
  - key: access_mode
    required: true
    type: string
    platform-arg: access_mode
    help-string: "Either remote or hpc."
  - key: exchange_format
    required: false
    type: string
    platform-arg: exchange_format
    help-string: "The IR to be passed. Default:qasm2"
  - key: timeout
    required: false
    type: string
    platform-arg: timeout
  - key: queued
    required: false
    type: string
    platform-arg: exchange_format
  - key: no_modify
    required: false
    type: string
    platform-arg: no_modify
